# log_format رخدادهای نوین‌خودرو — در http context (conf.d) قرار می‌گیرد.
# اعمال: bash scripts/apply-nginx-config.sh
log_format nk_events '$time_iso8601|$arg_e|$arg_c|$arg_p|$arg_v|$arg_r|$remote_addr|$http_user_agent';

# صندوق سرنخ: هر فرم/درخواست واقعی مشتری (فروش خودرو، مشاوره اقساط) اینجا ثبت می‌شود.
# مقادیر percent-encoded هستند؛ scripts/roi_report.py و پنل لوکال آن‌ها را decode می‌کنند.
log_format nk_leads '$time_iso8601|$arg_t|$arg_n|$arg_ph|$arg_c|$arg_m|$arg_v|$arg_p|$remote_addr|$http_user_agent';
