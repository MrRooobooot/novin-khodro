# Novin Khodro — vhost (mirror of /etc/nginx/sites-available/novin-khodro)
# اعمال: bash scripts/apply-nginx-config.sh
# نکته: add_header در هر location اینهریت سروری را ریست می‌کند → مجدد تکرار شده.

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name novinkhodro.shop www.novinkhodro.shop _;
    root /var/www/novin-khodro;
    index index.html;

    # یکسان‌سازی دامنه: www → apex (کاننیکال واحد برای SEO)
    if ($host = www.novinkhodro.shop) {
        return 301 https://novinkhodro.shop$request_uri;
    }
    ssl_certificate /etc/letsencrypt/live/novinkhodro.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/novinkhodro.shop/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ═══ سنجش بازدهی: نقطه پایانی رخداد (first-party pixel، بدون بک‌اند) ═══
    # js/analytics.js با GET /t?e=<event>&c=<car>&p=<place>&v=<value> فراخوانی می‌کند.
    # هر درخواست فقط در nk-events.log ثبت می‌شود و 204 برمی‌گردد.
    location = /t {
        access_log /var/log/nginx/nk-events.log nk_events;
        log_not_found off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ═══ صندوق سرنخ: ثبت درخواست واقعی مشتری (بدون بک‌اند، بدون ابزار ثالث) ═══
    # js/analytics.js → GET /lead?t=sell&n=<خودرو>&ph=<موبایل>&m=<یادداشت>
    # واتساپ/تلفن به قوت خود باقی است؛ این نقطه فقط داده را برای پیگیری نگه می‌دارد.
    location = /lead {
        access_log /var/log/nginx/nk-leads.log nk_leads;
        log_not_found off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ═══ تله اسکنرها: فقط GET/HEAD/OPTIONS مجاز است ═══
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 444;
    }

    # ═══ الگوهای اسکن (PHP/وردپرس/لوازم dev) — بدون لاگ، بدون پاسخ ═══
    location ~* (\.[a-z0-9]+\.(php|phtml|env|bak|old|save|sql|ini|log|yml|yaml)$|\.(php|phtml|asp|aspx|jsp|cgi|env)$|/wp-|/wordpress|/xmlrpc|/cgi-bin/|/goform/|/SDK/|/debug/|/\.git|/\.svn|/phpinfo|/config\.js|/ecosystem\.config\.js|/graphql) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # ═══ مسیرهای نقطه‌دار هرگز سرو نشوند (defense-in-depth) ═══
    # هر فایل/پوشه‌ای که با نقطه شروع می‌شود (.git/.env/.DS_Store/.hermes/.agents)
    # باید 403 بدهد، حتی اگر اشتباهی وارد docroot شود.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache Control for Static Assets
    # Regex locations match in ORDER — woff2 (per-file immutable) first.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Versioned (?v=YYYYMMDD) static assets
    location ~* \.(css|js|svg|jpg|jpeg|png|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # HTML revalidates so deploys with new ?v= apply instantly
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Static files; مسیر ناشناخته = 404 واقعی (قبلاً همه‌چیز index.html با ۲۰۰ برمی‌گشت
    # که soft-404 بی‌نهایت برای گوگل می‌ساخت). همه مسیرهای سایت hash-route هستند.
    location / {
        try_files $uri $uri/ =404;
    }
}

# HTTP: دامنه اصلی و www → HTTPS (+ مسیر ACME برای همهٔ میزبان‌ها)، بقیه → قطع
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name novinkhodro.shop www.novinkhodro.shop _;

    # چالش ACME باید برای هر میزبانی (از جمله www قبل از افزودن به گواهی) سرو شود
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/novin-khodro;
        default_type "text/plain";
        access_log off;
    }

    location / {
        if ($host = novinkhodro.shop) {
            return 301 https://novinkhodro.shop$request_uri;
        } # managed by Certbot
        if ($host = www.novinkhodro.shop) {
            return 301 https://novinkhodro.shop$request_uri;
        }
        return 444;
    }
}
